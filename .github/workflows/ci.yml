name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}, PostgreSQL ${{ matrix.postgres }}, MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 26, postgres: 18, mysql: '8.4' }
          - { node: 26, postgres: 17, mysql: '9' }
          - { node: 26, postgres: 16, mysql: '8.4' }
          - { node: 26, postgres: 15, mysql: '8.4' }
          - { node: 24, postgres: 18, mysql: '8.4' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SOSIE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SOSIE_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  plugin:
    name: The plugin loads in every assistant, and its listings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Agent Plugins 1.0, and Claude Code's files compiled from it.
      - run: npx -y opencastle@1.12.8 plugin check plugins/sosie
      # The marketplaces of Claude Code, Copilot, Cursor and Codex.
      - run: npx -y opencastle@1.12.8 plugin index --check --name sosie --owner MonkiLabs
