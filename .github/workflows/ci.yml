name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On main, by hand: it releases a version a push moved whose release stopped, once every job passes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}, PostgreSQL ${{ matrix.postgres }}, MySQL ${{ matrix.mysql }}, MongoDB ${{ matrix.mongodb }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    # A run takes about two minutes: a test that hangs fails the job here, not at GitHub's six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # MongoDB 8 will not start on Linux 6.19 and later (SERVER-121912): it runs where the kernel is older.
          - { node: 26, postgres: 18, mysql: '8.4', mongodb: '8.0', os: ubuntu-22.04 }
          - { node: 26, postgres: 17, mysql: '9', mongodb: '7.0' }
          - { node: 26, postgres: 16, mysql: '8.4', mongodb: '7.0' }
          - { node: 26, postgres: 15, mysql: '8.4', mongodb: '6.0' }
          - { node: 24, postgres: 18, mysql: '8.4', mongodb: '7.0' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
        # No health check: the tests wait for it, as its entrypoint makes the root user after it starts.
        ports:
          - 27017:27017
    env:
      SOSIE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SOSIE_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/
      SOSIE_TEST_MONGODB_URL: mongodb://root:root@127.0.0.1:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  plugin:
    name: The plugin loads in every assistant, and its listings are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Agent Plugins 1.0, and Claude Code's files compiled from it.
      - run: npx -y opencastle@1.12.8 plugin check plugins/sosie
      # The marketplaces of Claude Code, Copilot, Cursor and Codex.
      - run: npx -y opencastle@1.12.8 plugin index --check --name sosie --owner MonkiLabs

  # A release's pull request moves every package to a new version and dates the CHANGELOG's section for it; its merge
  # publishes it, here, once every other job passed on that commit. Any other push releases nothing: the docs, a
  # README or the code alike, even while a version is not released yet.
  release:
    name: A release's merge publishes its packages, tags it, and makes its GitHub Release
    needs: [test, plugin]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One release at a time: a push that lands during one waits for it, and then finds the version tagged.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the GitHub Release
      id-token: write # npm's provenance: the commit and the run that built each package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      # A push names the commit before it, so only the push that moved the version releases it; run by hand, none.
      - name: Is there a version to release?
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/release-plan.mjs "$RUNNER_TEMP/notes.md" ${BEFORE:+--since "$BEFORE"} >> "$GITHUB_OUTPUT"
      # Before anything long, and before npm's answer can mislead: it refuses a publish it does not authorize with a
      # 404 on the PUT, as if the package did not exist. npm whoami asks the same registry with the same token.
      - name: Check the npm token
        if: steps.plan.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set: Settings → Secrets and variables → Actions."
            exit 1
          fi
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::npm refused NPM_TOKEN: ${WHO}"
            echo "::error::It needs to publish the @sosie packages without a one-time password: a granular token with read and write on them, and 2FA bypassed."
            exit 1
          fi
          echo "Publishing as ${WHO}"
      - if: steps.plan.outputs.release == 'true'
        run: npm ci
      - if: steps.plan.outputs.release == 'true'
        run: npm run build
      - name: Publish, with provenance
        if: steps.plan.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          if ! node scripts/release.mjs --checked; then
            echo "::error::A 404 on the PUT of a package that exists means the token may not publish it: check that it lists every @sosie package with read and write."
            exit 1
          fi
      # One call makes both, on the commit published: a run that stops before it leaves no tag, so its re-run releases
      # the version still, passing over the packages on npm already.
      - name: Tag the release, and make its GitHub Release from the CHANGELOG
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v${VERSION}" --title "Sosie ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest
