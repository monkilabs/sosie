name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}, PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 26, postgres: 18 }
          - { node: 26, postgres: 17 }
          - { node: 26, postgres: 16 }
          - { node: 26, postgres: 15 }
          - { node: 24, postgres: 18 }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOSIE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  plugin:
    name: The plugin loads in every assistant, and its listings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Agent Plugins 1.0, and Claude Code's files compiled from it.
      - run: npx -y opencastle@1.12.8 plugin check plugins/sosie
      # The marketplaces of Claude Code, Copilot, Cursor and Codex.
      - run: npx -y opencastle@1.12.8 plugin index --check --name sosie --owner MonkiLabs
